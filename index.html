const padding = 30;

function path(points, PathType) {
  const outline = new PathType();
  points.forEach(([x, z], i) => {
    if (i === 0) outline.moveTo(x, -z);
    else outline.lineTo(x, -z);
  });
  outline.closePath();
  return outline;
}

function surface(area, y, material, height = 0) {
  const shape = path(area.ring, THREE.Shape);
  shape.holes = (area.holes || []).map(ring => path(ring, THREE.Path));
  const geometry = height
    ? new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
    : new THREE.ShapeGeometry(shape);
  geometry.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.y = y;
  mesh.castShadow = height > 0;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function makeRoad({ line, width }) {
  for (let i = 1; i < line.length; i++) {
    const [x1, z1] = line[i - 1];
    const [x2, z2] = line[i];
    const length = Math.hypot(x2 - x1, z2 - z1);
    if (!length) continue;
    const segment = rect(width, .05, length + width * .2, (x1 + x2) / 2, .01,
      (z1 + z2) / 2, roadMat);
    segment.rotation.y = Math.atan2(x2 - x1, z2 - z1);
    segment.castShadow = false;
  }
}

function outlineCenter(ring) {
  let area = 0, x = 0, z = 0;
  ring.forEach(([ax, az], i) => {
    const [bx, bz] = ring[(i + 1) % ring.length];
    const cross = ax * bz - bx * az;
    area += cross;
    x += (ax + bx) * cross;
    z += (az + bz) * cross;
  });
  return { x: x / (3 * area), z: z / (3 * area) };
}

function distanceToRing(x, z, ring) {
  let inside = false;
  let distance = Infinity;
  ring.forEach(([ax, az], i) => {
    const [bx, bz] = ring[(i + 1) % ring.length];
    if ((az > z) !== (bz > z) && x < ax + (bx - ax) * (z - az) / (bz - az)) {
      inside = !inside;
    }
    const dx = bx - ax;
    const dz = bz - az;
    const lengthSquared = dx * dx + dz * dz;
    const t = lengthSquared
      ? THREE.MathUtils.clamp(((x - ax) * dx + (z - az) * dz) / lengthSquared, 0, 1)
      : 0;
    distance = Math.min(distance, Math.hypot(x - ax - dx * t, z - az - dz * t));
  });
  return inside ? 0 : distance;
}

function setMapCoordinates(context) {

function trace(context, points, close = true) {
  points.forEach(([x, z], i) => {
    if (i === 0) context.moveTo(x, z);
    else context.lineTo(x, z);
  });
  if (close) context.closePath();
}

  context.fillStyle = color;

}
