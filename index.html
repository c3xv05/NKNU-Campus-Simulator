</style></head><body><div id="scene"></div><div id="top"><h1>🏫 NKNU 燕巢校園探索</h1><small>3D 概念原型・建築與相對位置僅供示意</small><div id="progress">已探索 0 / 12 個地標</div></div><div id="mapbox"><canvas id="map" width="220" height="220"></canvas><div id="legend">▲ 你的位置　■ 校園地標</div></div><div id="status">WASD 移動 · 滑鼠拖曳旋轉 · Shift 奔跑 · E 互動</div><div id="info">靠近建築，按 <strong>E</strong> 查看資訊</div><div id="touch"><div id="dpad"><span class="blank"></span><button data-key="KeyW">▲</button><span class="blank"></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div id="touchright"><button id="turnL">↶</button><button id="turnR">↷</button><button id="interact">互動</button></div></div><div id="start"><div id="panel"><div style="font-size:44px">🏫</div><h2>燕巢校園模擬器</h2><p>從校門出發，走訪校園建築、運動場與餐廳，探索 12 個地標。<br>電腦：WASD 移動、滑鼠拖曳旋轉、Shift 奔跑、E 互動。<br>手機：方向按鈕移動、↶↷ 轉向。</p><button id="play">開始探索</button><p id="notice">參考高師大官方校區平面圖；此為初版示意模型，並非精準 3D 實景。</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd4ed);scene.fog=new THREE.Fog(0x9bd4ed,140,330);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('scene').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x65845a,2.1));let sun=new THREE.DirectionalLight(0xfff5d5,2.6);sun.position.set(-60,110,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const groundMat=mat(0x85bb78),roadMat=mat(0x888d91);function rect(w,h,d,x,y,z,m){let mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
rect(290,.3,300,0,-.22,0,groundMat);
function road(points,width=8){for(let i=1;i<points.length;i++){let a=new THREE.Vector3(points[i-1][0],0,points[i-1][1]),b=new THREE.Vector3(points[i][0],0,points[i][1]);let mid=a.clone().add(b).multiplyScalar(.5),v=b.clone().sub(a);let m=rect(width,.07,v.length(),mid.x,.03,mid.z,roadMat);m.rotation.y=Math.atan2(v.x,v.z)}}
// 圖面北側在 -Z；建物位置為人工概化，不代表測量坐標
road([[0,137],[0,105],[0,75],[-18,54],[-34,31],[-25,8],[-10,-17],[2,-44],[8,-75],[24,-107]],10);road([[0,71],[24,48],[46,22],[46,-4],[28,-36],[8,-75]],8);road([[-26,8],[-49,-10],[-60,-35],[-42,-66],[4,-73]],7);road([[8,-75],[-12,-101],[-35,-110]],7);
const places=[
{name:'科技大樓',x:-57,z:-99,w:26,d:18,h:19,desc:'燕巢校區重要的教學與研究建築。'},
{name:'燕窩（學生餐廳）',x:-17,z:-111,w:20,d:13,h:8,desc:'校內餐飲與學生交流空間。'},
{name:'操場',x:36,z:-91,w:44,d:51,h:0,desc:'校園運動與休閒活動區。',kind:'field'},
{name:'生科大樓 A',x:-52,z:-48,w:19,d:17,h:16,desc:'生命科學相關教學研究空間。'},
{name:'生科大樓 B',x:-32,z:-30,w:19,d:17,h:15,desc:'生科教學區的一部分。'},
{name:'致理大樓',x:-10,z:-32,w:17,d:23,h:23,desc:'校內行政及教學活動所在的建築。'},
{name:'高斯大樓',x:-54,z:-7,w:21,d:18,h:21,desc:'燕巢校區的教學大樓之一。'},
{name:'寰宇大樓',x:-33,z:9,w:20,d:18,h:19,desc:'燕巢校區的主要建築之一。'},
{name:'圖資大樓',x:40,z:13,w:32,d:24,h:16,desc:'圖書與資訊資源相關服務空間。'},
{name:'文萃樓',x:-46,z:47,w:19,d:17,h:13,desc:'校園建築與活動空間。'},
{name:'歸燕食巢（學生餐廳）',x:-33,z:72,w:23,d:13,h:8,desc:'供學生用餐的校園設施。'},
{name:'霽遠樓',x:-40,z:94,w:21,d:13,h:15,desc:'校內宿舍生活區之一。'}];
let buildingMeshes=[];let palette=[0xb9c7d5,0xe0c8a8,0xc8e0de,0xd7bec5,0xe0d6bc,0xb2c5e4];const windowMat=mat(0x42647a);const stripeMat=mat(0xf1efe7);
function textSprite(t){let canvas=document.createElement('canvas');canvas.width=512;canvas.height=112;let c=canvas.getContext('2d');c.fillStyle='#142f42e8';c.beginPath();c.roundRect(3,3,506,105,18);c.fill();c.strokeStyle='#9addcf';c.lineWidth=3;c.stroke();c.fillStyle='white';c.font='bold 33px sans-serif';c.textAlign='center';c.fillText(t,256,70);let tex=new THREE.CanvasTexture(canvas);let spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));spr.scale.set(23,5,1);return spr}
for(let i=0;i<places.length;i++){const p=places[i];if(p.kind==='field'){rect(p.w,.06,p.d,p.x,.05,p.z,mat(0x376d46));rect(p.w-8,.08,p.d-10,p.x,.11,p.z,mat(0xa25c47));rect(p.w-17,.08,p.d-20,p.x,.17,p.z,mat(0x58a467));}else{let b=rect(p.w,p.h,p.d,p.x,p.h/2,p.z,mat(palette[i%palette.length]));buildingMeshes.push({mesh:b,p});rect(p.w+1,.7,p.d+1,p.x,p.h+.2,p.z,stripeMat);for(let f=3;f<p.h-1;f+=4){for(let k=-p.w/2+3;k<p.w/2-2;k+=5){rect(2,1.9,.15,p.x+k,f,p.z+p.d/2+.12,windowMat)}}}let label=textSprite(p.name);label.position.set(p.x,p.h+5,p.z);scene.add(label)}
// 校門、池塘、行道樹與遠景山丘
rect(17,1,2,0,7,130,mat(0x335c63));rect(2,7,2,-8,3.5,130,mat(0xe4e1cf));rect(2,7,2,8,3.5,130,mat(0xe4e1cf));let gate=textSprite('高師大燕巢校區 · 校門');gate.position.set(0,13,130);scene.add(gate);
for(let [x,z,rx,rz] of [[-17,53,12,8],[77,-88,19,12],[92,76,18,11]]){let pond=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.12,32),mat(0x56a8c4));pond.scale.set(rx,1,rz);pond.position.set(x,.08,z);scene.add(pond)}
const treeTrunk=mat(0x7e6547),leaf=mat(0x377c4e);function tree(x,z,s=1){rect(.8*s,3*s,.8*s,x,1.5*s,z,treeTrunk);let cr=new THREE.Mesh(new THREE.IcosahedronGeometry(2.5*s,1),leaf);cr.position.set(x,4.3*s,z);cr.castShadow=true;scene.add(cr)}
let rng=13;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}for(let i=0;i<190;i++){let x=(rand()-.5)*270,z=(rand()-.5)*275;if(Math.abs(x)<11&&z>0&&z<140)continue;if(places.some(p=>Math.abs(x-p.x)<p.w/2+8&&Math.abs(z-p.z)<p.d/2+8))continue;tree(x,z,.7+rand()*.55)}
const player=new THREE.Group();scene.add(player);const body=rect(1,2,1,0,0,0,mat(0x126b88));scene.remove(body);body.position.set(0,1.5,0);player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.67,14,12),mat(0xf0c9a0));head.position.y=3;player.add(head);const backpack=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.45),mat(0xf3b256));backpack.position.set(0,1.5,.7);player.add(backpack);player.position.set(0,0,115);
let yaw=0, pitch=.31, keys={},visited=new Set(),near=null,interactMsgUntil=0;const info=document.getElementById('info');const progress=document.getElementById('progress');function interact(){if(near){visited.add(near.name);info.innerHTML='<strong>'+near.name+'</strong><div>'+near.desc+'</div><small>已解鎖地標 '+visited.size+' / '+places.length+'</small>';progress.textContent='已探索 '+visited.size+' / '+places.length+' 個地標';interactMsgUntil=performance.now()+6500}}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)interact()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>keys={});
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(.12,Math.min(.95,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[b.dataset.key]=false)});document.getElementById('turnL').addEventListener('pointerdown',()=>yaw+=.25);document.getElementById('turnR').addEventListener('pointerdown',()=>yaw-=.25);document.getElementById('interact').onclick=interact;
const map=document.getElementById('map'),ctx=map.getContext('2d');function minimap(){const W=map.width,H=map.height,scale=.7;ctx.fillStyle='#b8d5aa';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.strokeStyle='#92969b';ctx.lineWidth=11;const roads=[[[0,137],[0,105],[0,75],[-18,54],[-34,31],[-25,8],[-10,-17],[2,-44],[8,-75],[24,-107]],[[0,71],[24,48],[46,22],[46,-4],[28,-36],[8,-75]],[[-26,8],[-49,-10],[-60,-35],[-42,-66],[4,-73]]];for(let rr of roads){ctx.beginPath();rr.forEach(([x,z],i)=>i?ctx.lineTo(x,z):ctx.moveTo(x,z));ctx.stroke()}for(let p of places){ctx.fillStyle=visited.has(p.name)?'#14b8a6':'#33556c';ctx.fillRect(p.x-p.w/2,p.z-p.d/2,p.w,p.d)}ctx.translate(player.position.x,player.position.z);ctx.rotate(-yaw);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(-6,6);ctx.lineTo(6,6);ctx.closePath();ctx.fill();ctx.restore();ctx.strokeStyle='#fff8';ctx.strokeRect(1,1,W-2,H-2)}
let previous=performance.now(),active=false;function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-previous)/1000,.05);previous=now;if(active){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);let dir=new THREE.Vector3(side,0,-f);if(dir.lengthSq()>0){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);let speed=keys.ShiftLeft||keys.ShiftRight?18:10;let next=player.position.clone().addScaledVector(dir,speed*dt);next.x=THREE.MathUtils.clamp(next.x,-137,137);next.z=THREE.MathUtils.clamp(next.z,-143,143);let blocked=buildingMeshes.some(({p})=>Math.abs(next.x-p.x)<p.w/2+1.3&&Math.abs(next.z-p.z)<p.d/2+1.3);if(!blocked)player.position.copy(next);player.rotation.y=Math.atan2(-dir.x,-dir.z)}near=places.reduce((best,p)=>{let d=Math.hypot(player.position.x-p.x,player.position.z-p.z);return d<19&&(!best||d<best.d)?{...p,d}:best},null);if(now>interactMsgUntil){info.innerHTML=near?`靠近 <strong>${near.name}</strong>，按 <strong>E</strong> 查看介紹`:'靠近建築，按 <strong>E</strong> 查看資訊'} }
let target=player.position.clone().add(new THREE.Vector3(Math.sin(yaw)*16,8+pitch*18,Math.cos(yaw)*16));cam.position.lerp(target,.13);cam.lookAt(player.position.x,2,player.position.z);minimap();renderer.render(scene,cam)}requestAnimationFrame(frame);document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';active=true};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
