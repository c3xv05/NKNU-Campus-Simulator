<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道路分區與人行道確認｜開發者</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#edf2ec;color:#193a37;font-family:system-ui;line-height:1.6}main{max-width:1150px;padding:20px;margin:auto}a{color:#27655f}button,select,textarea{font:inherit}button{padding:9px 12px;border:1px solid #a7bfb0;border-radius:8px;background:#fff;color:#244d43;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e59c42}h1{font-size:26px;margin:10px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.map-panel{background:#dce4da;border:1px solid #b7c9bd;border-radius:14px;overflow:hidden}#zoneMap{display:block;width:100%;height:76dvh;touch-action:none;user-select:none}aside{background:white;border-radius:12px;padding:15px;max-height:85dvh;overflow:auto}#zoneList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}#zoneList button{font-size:12px;padding:7px;text-align:left}.selected,[aria-pressed=true]{background:#2b6756;color:white}.tabs,.zoom-controls,.review-actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.road-review label{display:grid;margin:10px 0}.road-review select,.road-review textarea{width:100%;padding:8px;border:1px solid #a7bfb0;border-radius:8px;font-size:16px}.road-review textarea{min-height:90px}p{font-size:13px}.review-status{overflow-wrap:anywhere}.review-actions button{font-size:12px}#lock{padding:40px 15px;text-align:center}.caption{padding:9px;margin:0;background:#fff9}.topline{display:flex;justify-content:space-between;gap:10px}@media(max-width:700px){main{padding:14px}.layout{grid-template-columns:1fr}#zoneMap{height:60dvh}aside{max-height:none}#zoneList{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:23px}}
</style></head><body><main><div class="topline"><a href="./">← 回校園模擬器</a><button id="reviewLogout" type="button" hidden>登出開發者</button></div><h1>道路分區與人行道確認</h1><section id="lock"><p>這是開發者校正工作頁，請先回到封面登入開發者。</p><a href="./">回封面輸入開發者密碼</a></section><section id="reviewPage" hidden><p>R 編號依道路與校界分區；S 編號逐段確認人行道。新分區不套用舊 A1–D3 答案，植被與人行道草稿都不會自動改動場景。</p><div class="tabs"><button id="regionsTab" type="button">道路植被分區</button><button id="sidewalksTab" type="button">人行道逐段確認</button></div><div class="layout"><section class="map-panel"><div class="zoom-controls"><button id="reviewZoomIn" type="button" aria-label="放大地圖">＋</button><button id="reviewZoomOut" type="button" aria-label="縮小地圖">－</button><button id="reviewZoomReset" type="button">全校</button></div><svg id="zoneMap" aria-label="以道路為界的校園校正圖"></svg><p class="caption">雙指縮放、單指拖曳。人行道左右側以選取路段的 A→B 方向判斷。</p></section><aside><p id="mapSelection"></p><div id="reviewForm"></div><h2>選擇區域／路段</h2><div id="zoneList"></div></aside></div><p>路名依<a href="https://w3.nknu.edu.tw/images/files/yt_01_map.pdf" target="_blank" rel="noopener">校方校區圖</a>核對；莘學路為 OSM 名稱，尚待校方資料確認。校園輪廓與道路：© OpenStreetMap contributors。</p></section></main><script type="module" src="./zones-page.js"></script></body></html>
